<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>Órbita · Lembretes AME</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function () {
        var isDark = false;
        try {
          var stored = localStorage.getItem("orbita-theme");
          var pref = stored === "light" || stored === "dark" || stored === "system" ? stored : "system";
          isDark = pref === "dark" || (pref === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        } catch (e) {
          isDark = Boolean(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        }
        document.documentElement.setAttribute("data-theme", isDark ? "dark" : "light");
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", isDark ? "#121212" : "#ffffff");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
