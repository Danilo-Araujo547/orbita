[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["backend"]
testpaths = ["backend/tests"]
markers = ["send_regression: regressão de origem Oracle, agendas, calendário e transporte simulado"]

[tool.ruff]
target-version = "py312"
line-length = 110
exclude = ["migrations", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
