        name: operational_pending
        schema:
          type: boolean
      - in: query
        name: outcome
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - in: query
        name: response
        schema:
          type: string
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: start
        schema:
          type: string
          format: date
      - in: query
        name: unit
        schema:
          type: string
      tags:
      - agenda-items
      security:
      - orbitaInstanceKey: []
      - cookieAuth: []
      responses:
        '200':
          content:
