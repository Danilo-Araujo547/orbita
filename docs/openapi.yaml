components:
  schemas:
    AckOutput:
      type: object
      properties:
        ok:
          type: boolean
      required:
      - ok
    AgendaDeleteInput:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        version:
          type: integer
          minimum: 1
      required:
      - version
    AgendaInput:
      type: object
      properties:
        view_name:
          type: string
          maxLength: 200
        id:
          type: integer
          minimum: 1
        name:
          type: string
          default: Agenda Oracle
          maxLength: 120
        kind:
          allOf:
          - $ref: '#/components/schemas/AgendaInputKindEnum'
          default: consultation
        version:
          type: integer
          minimum: 0
        template_id:
          type: string
          maxLength: 40
        column_mapping: {}
        parameter_mapping: {}
        horizon_days:
          type: integer
          maximum: 365
          minimum: 1
          default: 10
        days_after:
          type: integer
          maximum: 180
          minimum: 0
          default: 10
        date_format:
          allOf:
          - $ref: '#/components/schemas/DateFormatEnum'
          default: native
        refresh_interval_minutes:
          type: integer
          maximum: 1440
          minimum: 5
        days_before:
          type: integer
          maximum: 30
          minimum: 0
          default: 5
        send_time:
          type: string
          format: time
          default: 09:00
        enabled:
          type: boolean
          default: true
        send_weekdays:
          type: array
          items:
            type: integer
            maximum: 6
            minimum: 0
          maxItems: 7
          minItems: 1
        blocked_day_policy: {}
      required:
      - column_mapping
      - parameter_mapping
      - template_id
      - version
      - view_name
    AgendaInputKindEnum:
      enum:
      - consultation
      - exam
      - lab
      - postprocedure
      type: string
      description: |-
        * `consultation` - consultation
        * `exam` - exam
        * `lab` - lab
        * `postprocedure` - postprocedure
    AgendaItem:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        external_id:
          type: string
          maxLength: 100
        kind:
          $ref: '#/components/schemas/AppointmentKindEnum'
        patient:
          type: string
          maxLength: 200
        phone:
          type: string
          maxLength: 40
        phone_numbers: {}
        patient_record:
          type: integer
          nullable: true
        patient_external_id:
          type: string
          maxLength: 100
        professional:
          type: string
          maxLength: 200
        city:
          type: string
          maxLength: 150
        tracking:
          type: object
          additionalProperties: {}
          readOnly: true
        procedure:
          type: string
          maxLength: 200
        procedure_code:
          type: string
          maxLength: 100
        appointment_type:
          type: string
        scheduled_at:
          type: string
          format: date-time
        arrival_time:
          type: string
          maxLength: 200
        status:
          type: string
          maxLength: 20
        synthetic:
          type: boolean
        revision:
          type: integer
          maximum: 2147483647
          minimum: 0
        source:
          type: string
          maxLength: 30
        last_seen_at:
          type: string
          format: date-time
          readOnly: true
        data_issue:
          type: string
          maxLength: 50
        record_type:
          type: string
          readOnly: true
        purpose:
          type: string
          readOnly: true
        kind_label:
          type: string
          readOnly: true
      required:
      - arrival_time
      - external_id
      - id
      - kind
      - kind_label
      - last_seen_at
      - patient
      - procedure
      - purpose
      - record_type
      - scheduled_at
      - tracking
    AgendaOutput:
      type: object
      properties:
        configurations:
          type: array
          items: {}
        archived_configurations:
          type: array
          items: {}
