name: orbita
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-orbita}
      POSTGRES_USER: ${DATABASE_USER:-orbita}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Configure DATABASE_PASSWORD no .env}
    ports: ["0.0.0.0:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  api:
    build: ./backend
    env_file: .env
    volumes: ["./data/report_sources:/app/report_sources:ro", "./files:/app/files:ro"]
    environment: &backend_environment
      DATABASE_HOST: db
      REDIS_URL: redis://redis:6379/0
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py bootstrap && python manage.py bootstrap_operations && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120 --access-logfile -"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  worker:
    build: ./backend
    env_file: .env
    volumes: ["./data/report_sources:/app/report_sources:ro", "./files:/app/files:ro"]
    environment: *backend_environment
    command: ["celery", "-A", "config", "worker", "--loglevel=warning", "--concurrency=2"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
  scheduler:
    build: ./backend
    env_file: .env
    volumes: ["./data/report_sources:/app/report_sources:ro", "./files:/app/files:ro"]
    environment: *backend_environment
    command: ["celery", "-A", "config", "beat", "--loglevel=warning", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
  baileys:
    build: ./baileys
    environment:
      REPORT_BAILEYS_TOKEN: ${REPORT_BAILEYS_TOKEN:?Configure REPORT_BAILEYS_TOKEN}
      REPORT_BAILEYS_AUTH_KEY: ${REPORT_BAILEYS_AUTH_KEY:?Configure REPORT_BAILEYS_AUTH_KEY}
      REPORT_BAILEYS_ALLOW_SENDS: ${REPORT_BAILEYS_ALLOW_SENDS:-0}
      REPORT_BAILEYS_CALLBACK: http://api:8000/api/v1/report-whatsapp/inbound/
    volumes: ["baileys_sessions:/data"]
    restart: unless-stopped
    stop_grace_period: 15s
    mem_limit: 512m
  panel:
    build: ./frontend
    ports: ["${PANEL_PORT:-8080}:80"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
  tests:
    profiles: ["test"]
    build: ./backend
    env_file: .env
    environment:
      <<: *backend_environment
      DATABASE_NAME: orbita_suite
      SEND_MODE: simulated
      META_REAL_ENABLED: "0"
      REPORT_BAILEYS_ALLOW_SENDS: "0"
      META_INBOX_SSH_HOST: ""
      REDIS_URL: ""
      CELERY_TASK_ALWAYS_EAGER: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./backend:/app:ro
      - ./files:/report_files:ro
    command: ["pytest", "-q", "-p", "no:cacheprovider", "tests"]
    depends_on:
      db: {condition: service_healthy}
volumes:
  baileys_sessions:
  postgres_data:
    external: true
    name: orbita_postgres_data
  redis_data:
    external: true
    name: orbita_redis_data
